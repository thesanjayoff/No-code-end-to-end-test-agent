title: "SauceDemo: cancelling checkout at step one returns to the cart"
startUrl: /
environment: local
tags:
  - checkout
steps:
  - fill Username with "standard_user"
  - fill Password with "secret_sauce"
  - click the Login button
  - click "Add to cart" for "Sauce Labs Backpack"
  - click "Cart, 1 items"
  - click the Checkout button
  - click the Cancel button
  - expect the Checkout button to be visible
