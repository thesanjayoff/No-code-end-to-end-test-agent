title: "SauceDemo: adding the Bike Light shows it in the cart"
startUrl: /
environment: local
tags:
  - cart
steps:
  - fill Username with "standard_user"
  - fill Password with "secret_sauce"
  - click the Login button
  - click "Add to cart" for "Sauce Labs Bike Light"
  - click "Cart, 1 items"
  - expect "Sauce Labs Bike Light" to be visible
